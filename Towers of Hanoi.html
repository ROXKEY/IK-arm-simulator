<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tower of Hanoi</title>
<style>
  :root{
    --bg:#1a1b26; --panel:#24263a; --accent:#7aa2f7; --text:#c0caf5; --peg:#565f89;
  }
  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){ --bg:#f4f4f9; --panel:#ffffff; --accent:#4c6ef5; --text:#2b2d42; --peg:#aaa; }
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    display:flex; flex-direction:column; align-items:center;
    padding:16px; padding-top:calc(16px + env(safe-area-inset-top,0px));
    padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  }
  h1{margin:8px 0; font-size:1.5rem;}
  .stats{display:flex; gap:20px; margin-bottom:12px; font-size:0.95rem;}
  .stats span b{color:var(--accent);}
  .controls{display:flex; gap:10px; margin-bottom:16px; flex-wrap:wrap; justify-content:center;}
  button{
    background:var(--accent); color:#fff; border:none; border-radius:8px;
    padding:8px 16px; font-size:0.9rem; cursor:pointer;
  }
  button.secondary{background:var(--panel); color:var(--text); border:1px solid var(--peg);}
  select{
    background:var(--panel); color:var(--text); border:1px solid var(--peg);
    border-radius:8px; padding:8px 10px; font-size:0.9rem;
  }
  #board{
    display:flex; justify-content:space-around; align-items:flex-end;
    width:100%; max-width:600px; height:260px; background:var(--panel);
    border-radius:12px; padding:16px; gap:8px;
  }
  .peg{
    flex:1; display:flex; flex-direction:column-reverse; align-items:center;
    position:relative; height:100%; cursor:pointer; padding-bottom:10px;
  }
  .peg-rod{
    position:absolute; bottom:10px; width:8px; height:85%; background:var(--peg);
    border-radius:4px; z-index:0;
  }
  .peg-base{
    position:absolute; bottom:6px; width:90%; height:8px; background:var(--peg);
    border-radius:4px; z-index:0;
  }
  .disk{
    height:22px; border-radius:6px; margin-bottom:4px; z-index:1;
    display:flex; align-items:center; justify-content:center;
    color:#fff; font-size:0.75rem; font-weight:600;
    transition:transform 0.15s ease;
  }
  .peg.selected .disk:last-child{ outline:3px solid var(--accent); }
  #msg{ margin-top:14px; min-height:24px; font-size:1rem; text-align:center; }
  .win{ color:#9ece6a; font-weight:700; }
</style>
</head>
<body>
  <h1>🗼 Tower of Hanoi</h1>
  <div class="stats">
    <span>Moves: <b id="moveCount">0</b></span>
    <span>Minimum: <b id="minMoves">7</b></span>
  </div>
  <div class="controls">
    <select id="diskSelect"></select>
    <button id="resetBtn">Restart</button>
    <button class="secondary" id="hintBtn">Auto-Solve</button>
  </div>
  <div id="board"></div>
  <div id="msg"></div>

<script>
const boardEl = document.getElementById('board');
const moveCountEl = document.getElementById('moveCount');
const minMovesEl = document.getElementById('minMoves');
const msgEl = document.getElementById('msg');
const diskSelect = document.getElementById('diskSelect');

let numDisks = 4;
let pegs = [[],[],[]];
let selectedPeg = null;
let moveCount = 0;
let solving = false;

const colors = ['#f7768e','#ff9e64','#e0af68','#9ece6a','#73daca','#7dcfff','#7aa2f7','#bb9af7'];

for(let i=3;i<=8;i++){
  const opt = document.createElement('option');
  opt.value = i; opt.textContent = i + ' disks';
  if(i===4) opt.selected = true;
  diskSelect.appendChild(opt);
}

function init(){
  numDisks = parseInt(diskSelect.value);
  pegs = [[],[],[]];
  for(let i=numDisks;i>=1;i--) pegs[0].push(i);
  moveCount = 0;
  selectedPeg = null;
  solving = false;
  moveCountEl.textContent = 0;
  minMovesEl.textContent = Math.pow(2,numDisks)-1;
  msgEl.innerHTML = '';
  render();
}

function render(){
  boardEl.innerHTML = '';
  pegs.forEach((peg, idx) => {
    const pegEl = document.createElement('div');
    pegEl.className = 'peg' + (selectedPeg===idx ? ' selected' : '');
    pegEl.onclick = () => handlePegClick(idx);

    const rod = document.createElement('div');
    rod.className = 'peg-rod';
    pegEl.appendChild(rod);
    const base = document.createElement('div');
    base.className = 'peg-base';
    pegEl.appendChild(base);

    peg.forEach(diskSize => {
      const disk = document.createElement('div');
      disk.className = 'disk';
      const widthPct = 30 + (diskSize/numDisks)*60;
      disk.style.width = widthPct + '%';
      disk.style.background = colors[(diskSize-1) % colors.length];
      disk.textContent = diskSize;
      pegEl.appendChild(disk);
    });
    boardEl.appendChild(pegEl);
  });
}

function handlePegClick(idx){
  if(solving) return;
  if(selectedPeg === null){
    if(pegs[idx].length === 0) return;
    selectedPeg = idx;
  } else if(selectedPeg === idx){
    selectedPeg = null;
  } else {
    tryMove(selectedPeg, idx);
    selectedPeg = null;
  }
  render();
}

function tryMove(from, to){
  const fromPeg = pegs[from];
  const toPeg = pegs[to];
  if(fromPeg.length === 0) return false;
  const disk = fromPeg[fromPeg.length-1];
  if(toPeg.length > 0 && toPeg[toPeg.length-1] < disk){
    msgEl.textContent = "Can't place a bigger disk on a smaller one!";
    setTimeout(()=>{ if(!solving) msgEl.textContent=''; }, 1500);
    return false;
  }
  fromPeg.pop();
  toPeg.push(disk);
  moveCount++;
  moveCountEl.textContent = moveCount;
  checkWin();
  return true;
}

function checkWin(){
  if(pegs[2].length === numDisks){
    msgEl.innerHTML = `<span class="win">🎉 Solved in ${moveCount} moves! (Minimum: ${Math.pow(2,numDisks)-1})</span>`;
  }
}

async function autoSolve(){
  if(solving) return;
  init();
  solving = true;
  const moves = [];
  function solve(n, from, to, via){
    if(n===0) return;
    solve(n-1, from, via, to);
    moves.push([from, to]);
    solve(n-1, via, to, from);
  }
  solve(numDisks, 0, 2, 1);
  for(const [from, to] of moves){
    await new Promise(r => setTimeout(r, 350));
    const disk = pegs[from].pop();
    pegs[to].push(disk);
    moveCount++;
    moveCountEl.textContent = moveCount;
    render();
  }
  solving = false;
  checkWin();
}

document.getElementById('resetBtn').onclick = init;
document.getElementById('hintBtn').onclick = autoSolve;
diskSelect.onchange = init;

init();
</script>
</body>
</html>
